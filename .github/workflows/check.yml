name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The whitespace rule the strictest consumer enforces on every file it copies from here.
      - name: Whitespace
        run: git diff --check "$(git mktree </dev/null)" HEAD
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check
